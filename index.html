<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9f5f0">
  <meta name="game-version" content="1.7.0">
  <meta name="description" content="給小小英雄的超人力霸王冒險基地。猜角色、變身、兄弟合作，一起守護地球！">
  <title>光之國・小英雄基地｜超人力霸王互動遊戲</title>
  <link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=1.7.0">
  <script src="app.js?v=1.7.0" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="光之國小英雄基地首頁"><img src="assets/emblem.svg" alt=""><span>光之國<small>小英雄基地</small></span></a>
    <div class="side-label">準備好冒險了嗎？</div>
    <nav aria-label="主選單">
      <button class="nav-item active" data-nav="home"><span data-icon="planet"></span>冒險大廳<span class="nav-dot"></span></button>
      <button class="nav-item" data-nav="heroes"><span data-icon="hero"></span>英雄大百科</button>
      <button class="nav-item" data-nav="badges"><span data-icon="medal"></span>我的小成就<span class="badge-count" id="badge-count">0</span></button>
    </nav>
    <div class="side-mission"><span class="tiny-stars">✦ <i>✧</i> ✦</span><div class="side-planet">🪐</div><strong>小小的你，也有大大的光</strong><p>勇敢嘗試、互相幫忙，<br>就是最棒的超人力霸王！</p></div>
    <button class="parent-link" id="help-button"><span data-icon="info"></span> 給爸爸媽媽的小筆記</button>
    <div class="sidebar-footer"><span class="online-dot"></span> 光之國，一切準備就緒 <span class="version-label">v1.7.0</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><span data-icon="sun"></span><span id="breadcrumb-text">今天，也一起閃閃發光！</span></div><div class="top-actions"><span class="star-wallet" aria-label="累積星星"><span>★</span> <b id="star-total">0</b><small>星星</small></span><button class="icon-button" id="sound-button" aria-label="關閉聲音" aria-pressed="true"></button><button class="icon-button" id="fullscreen-button" aria-label="全螢幕"></button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>用勇氣出發，用合作發光。</span><span>家庭同樂・粉絲創作 <span class="version-label">v1.7.0</span> <span class="footer-star">✦</span></span></footer>
  </div>
  <dialog id="info-dialog"><button class="dialog-close icon-button" aria-label="關閉說明">✕</button><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="confetti" aria-hidden="true"></div>
</body>
</html>
