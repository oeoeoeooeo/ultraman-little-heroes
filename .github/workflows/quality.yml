name: Game quality and responsive layout
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Optional deployed URL to verify'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  game-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAME_URL: ${{ inputs.game_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node --check app.js && npm test
      - run: npm run build && npm run test:security
      - run: npm run test:browser
      - name: Export screenshots in job logs (no paid artifact storage)
        if: always()
        run: python3 scripts/screenshot_log.py
